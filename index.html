<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPINE X — Spine Graphic Study</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ─────────────────────────────────────────────
   전시 모니터 기준 단위
   --u ≈ 1920×1080 에서 19px. 모든 크기는 이 단위의 배수로 잡아
   화면 크기가 달라져도 비율이 유지된다.
   ───────────────────────────────────────────── */
/* 제목 — Eurostile Bold Extended. 상용 폰트라 전시 PC 에 설치돼 있거나
   HTML 옆 fonts/ 폴더에 파일이 있어야 한다. 없으면 다음 폰트로 대체된다. */
@font-face{font-family:'SX Title';font-weight:700;font-style:normal;
  src:local('Eurostile Bold Extended'),local('Eurostile-BoldExtended'),
      local('EurostileLTStd-BoldEx2'),local('Eurostile LT Std Bold Extended 2'),
      local('EurostileExtended-Bold'),local('Eurostile Extended Bold'),
      url('fonts/EurostileBoldExtended.woff2') format('woff2'),
      url('fonts/EurostileBoldExtended.otf') format('opentype')}
:root{
  --u:min(1vw,1.78vh);
  --ink:#0a0a0a; --paper:#f0f0f0;
  --sans:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  --mono:'Courier New',Courier,'Pretendard',monospace;
  --title:'Eurostile Extd','EurostileExtd','Eurostile Extended','eurostile-extended','SX Title','Eurostile','Pretendard',sans-serif;
  --serif:Georgia,'Times New Roman',serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --side:clamp(260px, calc(50vw - 50vh - var(--u)*3.2), 30vw);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink)}
body{font-family:var(--sans);letter-spacing:-.02em;color:var(--paper);cursor:none;
  -webkit-font-smoothing:antialiased;word-break:keep-all}
.mono{font-family:var(--mono);font-weight:700;letter-spacing:0;text-transform:uppercase}
.eyebrow{font-size:calc(var(--u)*.85);opacity:.6}

/* ── 배경 필름 ───────────────────────────── */
#film{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(.82)}
#shade{position:fixed;inset:0;z-index:1;background:#000;opacity:.34;
  pointer-events:none;transition:opacity .6s var(--ease)}
body.gate #shade{opacity:.62} body.draw #shade{opacity:.8} body.reg #shade{opacity:.88}
body.form #film,body.form #shade{visibility:hidden}

canvas#main{position:fixed;inset:0;z-index:2;display:none}
body.form canvas#main{display:block}

/* ── 공통 화면 전환 ───────────────────────── */
.screen{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility .45s}
body.aod #aodGuide,body.gate #gate,body.draw #draw,body.reg #reg{opacity:1;visibility:visible}
.headline{font-family:var(--title);font-size:min(calc(var(--u)*1.7),32px);font-weight:700;letter-spacing:-.01em;line-height:1.2}
.subline{margin-top:calc(var(--u)*1.1);font-size:calc(var(--u)*1.2);font-weight:500;
  color:rgba(240,240,240,.62);line-height:1.5}

/* ── 1. AOD : 상시 시작 가이드 ───────────── */
/* 시작 · 인식 · 추첨 안내는 모두 같은 알약 형태 */
.pill{display:flex;align-items:center;gap:calc(var(--u)*1.04);
  padding:calc(var(--u)*1.25) calc(var(--u)*2.6) calc(var(--u)*1.25) calc(var(--u)*2.08);
  border-radius:999px;background:rgba(16,16,16,.74);color:#fff;
  border:1px solid rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 2vh 6vh rgba(0,0,0,.35);
  font:400 min(calc(var(--u)*1.68),32px)/1 var(--title);letter-spacing:0;
  transition:background .35s,color .35s,transform .35s var(--ease)}
.pill .ic{position:relative;flex:none;width:calc(var(--u)*4.1);height:calc(var(--u)*4.1);
  animation:breathe 2.6s var(--ease) infinite}
.pill .ic img{position:absolute;inset:0;width:100%;height:100%;transition:opacity .35s}
.pill .ic .k{opacity:0}
.pill .ic svg{position:absolute;inset:-14%;width:128%;height:128%;transform:rotate(-90deg)}
#gate .pill .ic{animation:none}
#aodGuide .alt{display:none}
#aodGuide .en{margin-top:calc(var(--u)*1.3);font-size:calc(var(--u)*1.05);font-weight:500;
  letter-spacing:0;color:rgba(255,255,255,.62)}
/* 손은 보이지만 아직 펴지지 않았을 때 — 즉시 반응해서 "보고 있다"는 걸 알린다 */
#aodGuide.seen .pill{background:rgba(244,244,244,.95);color:var(--ink);transform:scale(1.04)}
#aodGuide.seen .ic .w{opacity:0} #aodGuide.seen .ic .k{opacity:1}
#aodGuide.seen .def{display:none} #aodGuide.seen .alt{display:inline}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
#aodTitle{position:fixed;left:0;right:0;bottom:calc(var(--u)*2.2);z-index:3;text-align:center;
  font-size:calc(var(--u)*.8);color:rgba(240,240,240,.42);transition:opacity .5s}
body:not(.aod) #aodTitle{opacity:0}

/* ── 2. 게이트 : 손바닥 유지 ──────────────── */
.ringWrap{position:relative;width:22vh;height:22vh;margin-bottom:calc(var(--u)*2)}
.gateRing{width:26vh;height:26vh;margin-bottom:calc(var(--u)*1.8)}
.gateRing img{left:21.1%;top:31.5%;width:58%;height:58%;inset:auto}
.gateRing .track,.gateRing .prog{stroke-width:3}
.ringWrap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringWrap .track{fill:none;stroke:rgba(255,255,255,.16);stroke-width:4}
.ringWrap .prog{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;
  stroke-dasharray:1;stroke-dashoffset:1}
.ringWrap img{position:absolute;inset:18%;width:64%;height:64%}
.pill .ic.ringWrap{width:calc(var(--u)*3);height:calc(var(--u)*3);margin:0}
.pill .ic.ringWrap svg{inset:0;width:100%;height:100%}
.pill .ic.ringWrap img{left:11%;top:13%;width:80%;height:80%}
.pill .ringWrap .track,.pill .ringWrap .prog{stroke-width:9}

/* ── 3. 추첨 ─────────────────────────────── */
#roll{font:700 min(calc(var(--u)*4.4),50px)/1 var(--mono);letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:rgba(255,255,255,.88);white-space:nowrap}
#draw .pill{position:absolute;top:calc(var(--u)*3);left:50%;transform:translateX(-50%);transition:opacity .3s}
#draw.locked .pill{opacity:0}
#draw.locked #roll{color:#fff;animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ── 4. 형태 : 좌측 정보 · 우측 손동작 가이드 ── */
.panel{position:fixed;z-index:6;width:var(--side);color:var(--ink);
  background:rgba(240,240,240,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-radius:calc(var(--u)*1.4);padding:calc(var(--u)*1.5);
  opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility .45s}
body.form .panel{opacity:1;visibility:visible}

#info{left:calc(var(--u)*1.6);top:calc(var(--u)*1.6);display:flex;flex-direction:column;gap:calc(var(--u)*2)}
#info .eyebrow{color:var(--ink);opacity:.5;margin-bottom:calc(var(--u)*.6)}
#hTitle{font:700 calc(var(--u)*1.2)/1.2 var(--title);letter-spacing:0}
#seqBig{margin-top:calc(var(--u)*.7);font:700 calc(var(--u)*1.1)/1 var(--mono);letter-spacing:0;
  font-variant-numeric:tabular-nums;white-space:nowrap}
#info .now{padding-top:calc(var(--u)*1.6);border-top:1px solid rgba(10,10,10,.14)}
#modeKo{font-size:calc(var(--u)*3.6);font-weight:800;letter-spacing:-.03em;line-height:1}
#mode{margin-top:calc(var(--u)*.5);font:italic 400 calc(var(--u)*1.6)/1.1 var(--serif);opacity:.6}
#facesBox{display:none;align-items:baseline;gap:calc(var(--u)*.8);padding-top:calc(var(--u)*1.2);border-top:1px solid rgba(10,10,10,.14)}
#facesBox.show{display:flex}
#facesBox span{font-size:calc(var(--u)*.8)}
#faces{font:700 min(calc(var(--u)*2.2),32px)/1 var(--mono)}

#gestureGuide{right:calc(var(--u)*1.6);top:50%;transform:translateY(-50%);width:auto;padding:calc(var(--u)*.55)}
#gestureGuide .eyebrow{color:var(--ink);opacity:.5;padding:calc(var(--u)*.2) calc(var(--u)*.5) calc(var(--u)*.7)}
#gestures{display:flex;flex-direction:column;gap:calc(var(--u)*.2)}
.g{position:relative;display:grid;grid-template-columns:calc(var(--u)*2.7) 1fr;align-items:center;
  gap:calc(var(--u)*.6);padding:calc(var(--u)*.3) calc(var(--u)*.9) calc(var(--u)*.3) calc(var(--u)*.3);
  border-radius:calc(var(--u)*.7);transition:background .25s,transform .25s var(--ease)}
.g .ic{position:relative;aspect-ratio:1}
.g .ic img{position:absolute;inset:0;width:100%;height:100%}
.g .ic .w{opacity:0}
.g b{display:block;font:700 calc(var(--u)*.72)/1.15 var(--title);letter-spacing:0}
.g small{display:block;margin-top:calc(var(--u)*.25);font:400 calc(var(--u)*.6)/1.3 var(--mono);color:#555}
.g.active{background:var(--ink);color:#fff}
.g.active small{color:rgba(255,255,255,.65)}
.g.active .ic .w{opacity:1} .g.active .ic .k{opacity:0}
/* 한동안 같은 모드에 머물면 아직 안 해본 손동작을 살짝 권한다 */
.g.suggest{box-shadow:inset 0 0 0 2px var(--ink);animation:nudge 1.3s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(calc(var(--u)*-.5))}}
body.exiting #gestureGuide,body.exiting #info{opacity:.28}

/* 모드 전환 토스트 — 시선이 머무는 화면 위쪽 중앙 */
#toast{position:fixed;left:50%;top:calc(var(--u)*2);z-index:12;display:flex;align-items:center;
  gap:calc(var(--u)*.9);padding:calc(var(--u)*.7) calc(var(--u)*2) calc(var(--u)*.7) calc(var(--u)*1.1);
  border-radius:999px;background:rgba(10,10,10,.9);color:#fff;
  font:700 calc(var(--u)*.9)/1 var(--title);letter-spacing:0;white-space:nowrap;
  transform:translate(-50%,-140%);opacity:0;transition:transform .45s var(--ease),opacity .35s}
#toast.show{transform:translate(-50%,0);opacity:1}
#toast img{width:calc(var(--u)*1.7);height:calc(var(--u)*1.7)}
#toast i{font:italic 400 .82em var(--serif);opacity:.6;margin-left:.35em}
body:not(.form) #toast{opacity:0}

/* 손이 사라졌을 때 — 숫자 카운트다운 */
#exitOv{position:fixed;inset:0;z-index:11;display:flex;align-items:center;justify-content:center;
  background:rgba(240,240,240,.5);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
body.form.exiting #exitOv{opacity:1;visibility:visible}
#exitOv .card{display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:calc(var(--u)*1.8) calc(var(--u)*2.6);border-radius:calc(var(--u)*1.2);
  background:rgba(10,10,10,.92);color:#fff;box-shadow:0 3vh 8vh rgba(0,0,0,.25)}
#exitOv .ringWrap{width:11vh;height:11vh;margin-bottom:calc(var(--u)*1.6)}
#exitOv .prog{stroke-dashoffset:0}
#exitNum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:700 min(calc(var(--u)*2.8),32px)/1 var(--mono)}
#exitOv .headline{font-size:min(calc(var(--u)*1.3),32px)}
#exitOv .subline{font-size:calc(var(--u)*1.1)}

/* ── 5. 등재 ─────────────────────────────── */
#reg .eyebrow{color:#fff;margin-bottom:calc(var(--u)*1.6)}
#regCv{width:min(38vh,400px);height:min(38vh,400px);background:var(--paper);border-radius:calc(var(--u)*.8)}
#regName{margin-top:calc(var(--u)*1.6);font:700 min(calc(var(--u)*1.5),32px)/1.1 var(--title);color:#fff}
#regSeq{margin-top:calc(var(--u)*1);font-size:calc(var(--u)*1.05);color:rgba(240,240,240,.6)}

/* ── 카메라 미리보기 ─────────────────────── */
#dock{position:fixed;left:calc(var(--u)*1.6);bottom:calc(var(--u)*1.6);z-index:30;
  display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*.8)}
#pip{width:clamp(220px,17vw,360px);border-radius:calc(var(--u)*.9);overflow:hidden;background:#000;
  border:1px solid rgba(255,255,255,.18);box-shadow:0 1vh 3vh rgba(0,0,0,.25)}
body.form #pip{border-color:rgba(10,10,10,.2)}
#pipCv{display:block;width:100%;height:auto}
#pipBar{display:flex;justify-content:space-between;align-items:center;
  padding:calc(var(--u)*.55) calc(var(--u)*.8);background:#000;
  font-size:calc(var(--u)*.9);font-weight:600;color:rgba(255,255,255,.6)}
#pipG{color:#fff}
#pipDot{width:calc(var(--u)*.6);height:calc(var(--u)*.6);border-radius:50%;background:#444;transition:.2s}
#pipDot.on{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.18)}
#warn{max-width:var(--side);white-space:pre-line;font-size:calc(var(--u)*.85);line-height:1.6;font-weight:500;
  color:rgba(240,240,240,.55)}
#warn:empty,html:not(.dbg) #warn{display:none}
body.form #warn{color:rgba(10,10,10,.55)}
#vid{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none}

/* ── 4:3 등 세로 여백이 좁은 화면 : 가이드를 하단 가로 막대로 ── */
@media (max-aspect-ratio: 3/2){
  :root{--u:min(1.25vw,1.6vh)}
  #gestureGuide{top:auto;bottom:calc(var(--u)*1.2);right:50%;transform:translateX(50%);width:auto;padding:calc(var(--u)*.8)}
  #gestureGuide .eyebrow{display:none}
  #gestures{flex-direction:row}
  .g{grid-template-columns:1fr;justify-items:center;text-align:center;width:calc(var(--u)*7.4);
     padding:calc(var(--u)*.5) calc(var(--u)*.3)}
  .g .ic{width:calc(var(--u)*2.7)}
  .g b{font-size:calc(var(--u)*.7)} .g small{font-size:calc(var(--u)*.58)}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*-.5))}}
  #info{width:min(36vw,420px)}
  #dock{left:auto;right:calc(var(--u)*1.6);top:calc(var(--u)*1.6);bottom:auto;align-items:flex-end}
  #pip{width:clamp(160px,18vw,260px)}
}
</style>
</head>
<body class="aod">

<video id="film" src="spinex_film.mp4" autoplay muted loop playsinline preload="auto"></video>
<div id="shade"></div>
<canvas id="main" class="stage"></canvas>

<!-- 1. AOD -->
<section id="aodGuide" class="screen">
  <div class="pill">
    <span class="ic"><img class="w" data-icon="open_w" alt=""><img class="k" data-icon="open_b" alt=""></span>
    <span><span class="def">Show your open hand</span><span class="alt">Open all fingers</span></span>
  </div>
</section>
<div id="aodTitle" class="mono">Spine X · Spine Graphic Study — Specimen Archive <span id="aodCount"></span></div>

<!-- 2. 게이트 -->
<section id="gate" class="screen">
  <div class="ringWrap gateRing">
    <svg viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="96"/>
      <circle id="gRing" class="prog" cx="100" cy="100" r="96" pathLength="1"/></svg>
    <img data-icon="open_w" alt="">
  </div>
  <h1 class="headline">Hold still</h1>
</section>

<!-- 3. 추첨 -->
<section id="draw" class="screen">
  <div id="roll">(0, 0, 0, 0)</div>
  <div class="pill">
    <span class="ic"><img data-icon="base_w" alt=""></span>
    <span>Make a fist</span>
  </div>
</section>

<!-- 4. 형태 -->
<aside id="info" class="panel">
  <div>
    <p class="eyebrow mono">Specimen</p>
    <h2 id="hTitle">—</h2>
    <div id="seqBig"></div>
  </div>
  <div id="facesBox"><span class="mono">Faces</span><b id="faces">3</b></div>
</aside>
<aside id="gestureGuide" class="panel">
  <div id="gestures"></div>
</aside>
<div id="toast"><img alt=""><span></span></div>
<div id="exitOv"><div class="card">
  <div class="ringWrap">
    <svg viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="96"/>
      <circle id="exitArc" class="prog" cx="100" cy="100" r="96" pathLength="1"/></svg>
    <b id="exitNum">3</b>
  </div>
  <h1 class="headline">End study</h1>
</div></div>

<!-- 5. 등재 -->
<section id="reg" class="screen">
  <p class="eyebrow mono">Registered</p>
  <canvas id="regCv" width="720" height="720"></canvas>
  <div id="regName"></div>
  <div id="regSeq" class="mono"></div>
</section>

<div id="dock">
  <div id="warn"></div>
  <div id="pip">
    <canvas id="pipCv" width="424" height="318"></canvas>
    <div id="pipBar"><span id="pipG">NO HAND</span><span id="pipDot"></span></div>
  </div>
</div>
<video id="vid" playsinline muted></video>

const NP=new Uint8Array(512);
(()=>{ const p=[...Array(256).keys()];
  for(let i=255;i>0;i--){const j=(Math.random()*(i+1))|0;[p[i],p[j]]=[p[j],p[i]];}
  for(let i=0;i<512;i++) NP[i]=p[i&255]; })();
const fade=t=>t*t*(3-2*t);
function vnoise(x,y){
  const xi=Math.floor(x)&255, yi=Math.floor(y)&255;
  const xf=x-Math.floor(x), yf=y-Math.floor(y);
  const h=(a,b)=>NP[(NP[a]+b)&511]/255;
  const u=fade(xf), v=fade(yf);
  return lerp(lerp(h(xi,yi),h(xi+1,yi),u), lerp(h(xi,yi+1),h(xi+1,yi+1),u), v);
}
function fbm(x,y,oct=4){ let s=0,a=.5,f=1;
  for(let i=0;i<oct;i++){ s+=a*vnoise(x*f,y*f); f*=2.1; a*=.5; } return s; }

const erf = x => { const s=Math.sign(x); x=Math.abs(x);
  const t=1/(1+.3275911*x);
  return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t
    +0.254829592)*t*Math.exp(-x*x)); };
const phi = z => .5*(1+erf(z/Math.SQRT2));
const D=(l,a,b)=>Math.hypot(l[a].x-l[b].x, l[a].y-l[b].y);

// 수열은 매번 새로 뽑는다. 칸당 상한 100.
// 낮은 값이 더 자주 나오게 해서 성긴 개체와 빽빽한 개체가 고루 섞이게 한다.
const SEQ_MAX=100, SEQ_TOTAL_MAX=200;
const rollOne = () => Math.round(SEQ_MAX*Math.pow(Math.random(),1.8));
// 칸당 100, 총합 200. 넘으면 비율을 유지한 채 줄인다.
function rollSeq(){
  let v=[Math.max(1,rollOne()), Math.max(1,rollOne()), rollOne(), Math.max(1,rollOne())];
  const t=v[0]+v[1]+v[2]+v[3];
  if(t>SEQ_TOTAL_MAX){
    const k=SEQ_TOTAL_MAX/t;
    v=v.map((n,i)=> i===2 ? Math.floor(n*k) : Math.max(1,Math.floor(n*k)));
  }
  return v;
}
let lastRatios=[0,0,0,0];
function handRatios(l){
  const pw=D(l,5,17)||1e-4;
  return [ D(l,5,8)/(D(l,13,16)||1e-4), D(l,0,9)/pw,
           D(l,9,12)/pw, D(l,17,20)/(D(l,9,12)||1e-4) ];
}
function seqFromHand(l){
  if(l) lastRatios=handRatios(l);
  return rollSeq();
}

// ═══════════════════════════════════════════════
//  제스처 — 곡률 기반 + 시간 안정화
// ═══════════════════════════════════════════════
const TIP={index:8,middle:12,ring:16,pinky:20};
const MCP={index:5,middle:9,ring:13,pinky:17};
const PIP_={index:6,middle:10,ring:14,pinky:18};
const G={ NONE:'none', FIST:'fist', PALM:'palm',
          BLEED:'bleed', TYPO:'typo', MATTER:'matter', INVERT:'invert' };
const GLABEL={ none:'—', fist:'FIST', palm:'PALM', bleed:'THUMB+INDEX',
               typo:'THUMB+MIDDLE', matter:'THUMB+RING', invert:'THUMB+PINKY' };

// 손가락 굽힘: MCP→PIP 와 PIP→TIP 사이 각도. 크면 굽은 것.
function curl(l,k){
  const a=l[MCP[k]], b=l[PIP_[k]], c=l[TIP[k]];
  const v1x=b.x-a.x, v1y=b.y-a.y, v2x=c.x-b.x, v2y=c.y-b.y;
  const d=(v1x*v2x+v1y*v2y)/((Math.hypot(v1x,v1y)*Math.hypot(v2x,v2y))||1e-6);
  return Math.acos(clamp(d,-1,1));            // 0 = 곧게 폄
}
// 손바닥 방향은 카메라 좌표계 부호가 환경마다 달라 신뢰하기 어렵다.
// 표시용으로만 쓰고, 진입 판정은 '손을 편 상태'로 한다.
function palmFacing(l,handed){
  const ax=l[5].x-l[0].x, ay=l[5].y-l[0].y;
  const bx=l[17].x-l[0].x, by=l[17].y-l[0].y;
  const cross = ax*by - ay*bx;
  return handed==='Left' ? cross<0 : cross>0;
}

const raw={ g:G.NONE, tilt:0, facing:false, open:0 };
function analyse(l, handed){
  const pw = D(l,5,17)||1e-4;
  const cl = { index:curl(l,'index'), middle:curl(l,'middle'),
               ring:curl(l,'ring'),   pinky:curl(l,'pinky') };
  const ext = {}; for(const k in cl) ext[k] = cl[k] < .95;
  const nExt = Object.values(ext).filter(Boolean).length;

  // 엄지 접촉 — 손바닥 폭으로 정규화, 가장 가까운 하나만
  const dist={ index:D(l,4,8)/pw, middle:D(l,4,12)/pw,
               ring:D(l,4,16)/pw, pinky:D(l,4,20)/pw };
  let hit=null, hv=.30;
  for(const k in dist) if(dist[k]<hv){ hv=dist[k]; hit=k; }
  // 2위와 충분히 벌어져야 채택 (중지/약지 혼동 방지)
  if(hit){
    let second=9; for(const k in dist) if(k!==hit) second=Math.min(second,dist[k]);
    if(second - hv < .09) hit=null;
  }

  raw.tilt   = Math.atan2(l[9].y-l[0].y, l[9].x-l[0].x) + Math.PI/2;
  raw.facing = palmFacing(l,handed);
  raw.open   = nExt/4;

  if(hit==='index')  return G.BLEED;
  if(hit==='middle') return G.TYPO;
  if(hit==='ring')   return G.MATTER;
  if(hit==='pinky')  return G.INVERT;
  // 접촉이 없을 때만 주먹/손바닥 판정
  if(nExt>=3) return G.PALM;
  if(nExt===0 && cl.index>1.5 && cl.middle>1.5) return G.FIST;
  return G.NONE;
}

// 같은 제스처가 STABLE_MS 이상 유지돼야 전환한다
const STABLE_MS=170;
let gStable=G.NONE, gPend=G.NONE, gPendT=0;
function stabilise(g, now){
  if(g!==gPend){ gPend=g; gPendT=now; }
  else if(now-gPendT>STABLE_MS && g!==G.NONE) gStable=g;
  return gStable;
}

// ═══════════════════════════════════════════════
//  모티프
// ═══════════════════════════════════════════════
let seq=[8,10,0,25], motif=[], spin=0;

// pattern2.html 의 generateLayout 을 그대로 옮긴다.
// 파티클은 왼쪽 반면에만 놓이고, 세로 중심선을 기준으로 미러링된다.
const TIER_A_MIN=190, TIER_B_MIN=70, REF=900;
let MAX_TRIM=1.0;   // 1.0 = 원본   // REF: 원본이 상정한 캔버스 짧은 변
const rnd=(a,b)=>a+Math.random()*(b-a);

function buildMotif(){
  const [seqC,seqT,seqL,seqCa]=seq;
  const pool=[];
  for(let i=0;i<seqC ;i++) pool.push(SI.C);
  for(let i=0;i<seqT ;i++) pool.push(SI.T);
  for(let i=0;i<seqL ;i++) pool.push(SI.L);
  for(let i=0;i<seqCa;i++) pool.push(SI.Ca);
  for(let i=pool.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]];
  }
  motif=[];
  const n=pool.length; if(!n) return;

  const spreadFactor = seqCa>=60 ? 1.0 : 0.4+(seqCa/60)*0.6;
  const maxR = 0.60*REF*spreadFactor;

  const sizeFactor = Math.min(0.15+(seqC/8)*0.85, 2.5);
  const cMinSize=Math.max(30, 300-100*sizeFactor);
  const eMinSize=Math.max(15,  67- 33*sizeFactor);
  // 크기 상한만 하한 쪽으로 당긴다. 당기는 정도는 밀집도가 정한다 —
  // 좁은 반경에 마디가 많을수록 세게. 성긴 개체는 원본 그대로 둔다.
  const trim = MAX_TRIM * clamp(12*(maxR/REF)/Math.sqrt(n), 0.35, 1.0);
  const cMaxSize=cMinSize + (Math.min(700, 300+100*sizeFactor)-cMinSize)*trim;
  const eMaxSize=eMinSize + (Math.min(200,  67+ 33*sizeFactor)-eMinSize)*trim;

  const concExp  = Math.max(0.15, Math.min(2.5, seqT*0.04));
  const maxBias  = Math.min(seqL/40, 1.0)*0.85;
  const biasAngle= rnd(Math.PI/2, Math.PI*1.5);

  // 각도별 반경 상한에 결을 준다 — 마디가 많을수록 강하게.
  // 위치만 바꾸고 크기 산출(t)은 원본 값을 그대로 쓴다.
  const lobeK   = 3 + Math.floor(Math.random()*5);        // 3~7 로브
  const lobeAmp = (0.14 + 0.24*Math.min(n/200,1)) * rnd(0.7,1.15);
  const lobePh  = rnd(0, TAU);

  for(let i=0;i<n;i++){
    const rawAngle=rnd(Math.PI/2, Math.PI*1.5);
    const biasPull=rnd(0, maxBias);
    const angle=lerp(rawAngle, biasAngle, biasPull);
    const rScale=rnd(0.55,1.0);
    const r0=Math.pow(Math.random(), concExp)*maxR*rScale;
    const t=r0/maxR;
    const size=rnd(lerp(cMinSize,eMinSize,t), lerp(cMaxSize,eMaxSize,t));
    const lobe=1 + lobeAmp*Math.cos(lobeK*angle + lobePh);
    motif.push({ si:pool[i], angle, rF:(r0*lobe)/REF, szF:size/REF, rot:rnd(0,TAU) });
  }
}

// N=1 이면 원본 구성 그대로. N>1 이면 그 구성을 0.9배로 줄여
// 중심에서 D 만큼 밀어낸 자리에 N개 배치한다.
// D 는 이웃 면이 서로 절반 넘게 겹치지 않는 최소 거리로 정한다.
function stampMotif(g, W, H, N, col, opt={}){
  const RH=Math.min(W,H), cx=W/2, cy=H/2;
  const arms=Math.max(1, N|0);
  const SC=0.72*(opt.scale||1);   // 0.9 × 0.8
  const ink=col || '#0a0a0a';

  // 구성 자체의 반경
  let Rp=0;
  for(const p of motif) Rp=Math.max(Rp, (p.rF + p.szF*0.5)*RH*SC);
  // 이웃 중심 간격 = 2·D·sin(π/N) ≥ Rp  →  겹침 절반 이하
  const D = arms<=1 ? 0 : Rp/(2*Math.sin(Math.PI/arms));

  g.save();
  if(opt.xor) g.globalCompositeOperation='xor';
  g.fillStyle=ink; g.strokeStyle=ink;

  for(let f=0; f<arms; f++){
    const ang = -Math.PI/2 + (arms>1 ? spin + f*TAU/arms : 0);
    g.save();
    g.translate(cx+Math.cos(ang)*D, cy+Math.sin(ang)*D);
    if(arms>1) g.rotate(ang+Math.PI/2);

    for(const p of motif){
      const r=p.rF*RH*SC;
      const bx=Math.cos(p.angle)*r, by=Math.sin(p.angle)*r;
      const s=shapes[p.si];
      const sc=(p.szF*RH*SC)/Math.max(s.vw,s.vh);
      if(sc<=0) continue;
      for(const m of [1,-1]){
        g.save();
        g.translate(bx*m, by);
        g.rotate(p.rot*m);
        g.scale(sc,sc);
        g.translate(-s.vw/2,-s.vh/2);
        if(opt.strokeOnly){ g.lineWidth=(opt.lw||2)/sc; g.stroke(s.path); }
        else g.fill(s.path);
        g.restore();
      }
    }
    g.restore();
  }
  g.restore();
}

const INF=1e20;
function dt1d(f,d,v,z,n){
  let k=0; v[0]=0; z[0]=-INF; z[1]=INF;
  for(let q=1;q<n;q++){
    let s=((f[q]+q*q)-(f[v[k]]+v[k]*v[k]))/(2*q-2*v[k]);
    while(s<=z[k]){ k--; s=((f[q]+q*q)-(f[v[k]]+v[k]*v[k]))/(2*q-2*v[k]); }
    k++; v[k]=q; z[k]=s; z[k+1]=INF;
  }
  k=0;
  for(let q=0;q<n;q++){ while(z[k+1]<q) k++; d[q]=(q-v[k])*(q-v[k])+f[v[k]]; }
}
let _sc=null;
function edt(grid,w,h,out){
  const n=Math.max(w,h);
  if(!_sc||_sc.n<n) _sc={n,f:new Float64Array(n),d:new Float64Array(n),
    v:new Int32Array(n),z:new Float64Array(n+1)};
  const {f,d,v,z}=_sc;
  for(let x=0;x<w;x++){
    for(let y=0;y<h;y++) f[y]=grid[y*w+x]?0:INF;
    dt1d(f,d,v,z,h);
    for(let y=0;y<h;y++) out[y*w+x]=d[y];
  }
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++) f[x]=out[y*w+x];
    dt1d(f,d,v,z,w);
    for(let x=0;x<w;x++) out[y*w+x]=Math.sqrt(d[x]);
  }
  return out;
}

//  캔버스
// ═══════════════════════════════════════════════
const cv=$('main'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;

const mk=document.createElement('canvas'), mkc=mk.getContext('2d',{willReadFrequently:true});
const px=document.createElement('canvas'), pxc=px.getContext('2d');
const bg=document.createElement('canvas'), bgc=bg.getContext('2d',{willReadFrequently:true});
const xo=document.createElement('canvas'), xoc=xo.getContext('2d');
let MS=.55, MW=0, MH=0;
let maskBits=null, sdOut=null, sdIn=null;

function resize(){
  DPR=Math.min(devicePixelRatio||1, 2);
  W=innerWidth; H=innerHeight;
  for(const c of [cv]){
    c.width=Math.round(W*DPR); c.height=Math.round(H*DPR);
    c.style.width=W+'px'; c.style.height=H+'px';
  }
  xo.width=Math.round(W*DPR); xo.height=Math.round(H*DPR);
  syncMask(); matCache=null;
}
function syncMask(){
  MW=Math.max(200,Math.round(W*MS)); MH=Math.max(150,Math.round(H*MS));
  mk.width=MW; mk.height=MH; px.width=MW; px.height=MH; bg.width=MW; bg.height=MH;
  maskBits=new Uint8Array(MW*MH);
  sdOut=new Float64Array(MW*MH); sdIn=new Float64Array(MW*MH);
}
addEventListener('resize',resize);

function buildMask(N){
  mkc.setTransform(1,0,0,1,0,0);
  mkc.fillStyle='#fff'; mkc.fillRect(0,0,MW,MH);
  mkc.save(); mkc.scale(MS,MS);
  stampMotif(mkc,W,H,N,'#000');
  mkc.restore();
  const d=mkc.getImageData(0,0,MW,MH).data;
  for(let i=0,n=MW*MH;i<n;i++) maskBits[i]= d[i*4]<128 ?1:0;
}
function buildSDF(){
  edt(maskBits,MW,MH,sdOut);
  const inv=new Uint8Array(MW*MH);
  for(let i=0,n=MW*MH;i<n;i++) inv[i]=maskBits[i]?0:1;
  edt(inv,MW,MH,sdIn);
}
const signed = i => maskBits[i] ? -sdIn[i] : sdOut[i];
function blit(img){ pxc.putImageData(img,0,0); ctx.drawImage(px,0,0,MW,MH,0,0,W,H); }
const bcCv=document.createElement('canvas'), bcCtx=bcCv.getContext('2d');
function blitCache(c){
  if(bcCv.width!==c.w||bcCv.height!==c.h){ bcCv.width=c.w; bcCv.height=c.h; }
  bcCtx.putImageData(c.img,0,0);
  ctx.drawImage(bcCv,0,0,c.w,c.h,0,0,W,H);
}

// ═══════════════════════════════════════════════
//  재질 — 거리장을 높이로 삼아 법선을 만들고 조명한다.
//  재질이 바뀔 때 한 번만 계산해서 캐시한다.
// ═══════════════════════════════════════════════
const MATERIALS=['Solid','Glass','Metal','Sand','Cell','Outline'];

// 재질은 전용 버퍼에서 계산한다 — 표시 해상도를 건드리지 않으므로
// syncMask 재할당과 마스크 재생성이 통째로 사라진다.
const MAT_S=0.80;
const mCv=document.createElement('canvas'), mCtx=mCv.getContext('2d',{willReadFrequently:true});
let mW=0,mH=0,mMask=null,mIn=null,mInv=null;
function buildMatBuffers(N){
  const w=Math.max(200,Math.round(W*MAT_S)), h=Math.max(150,Math.round(H*MAT_S));
  if(w!==mW||h!==mH){
    mW=w; mH=h; mCv.width=w; mCv.height=h;
    mMask=new Uint8Array(w*h); mIn=new Float64Array(w*h); mInv=new Uint8Array(w*h);
  }
  mCtx.setTransform(1,0,0,1,0,0);
  mCtx.fillStyle='#fff'; mCtx.fillRect(0,0,mW,mH);
  mCtx.save(); mCtx.scale(MAT_S,MAT_S); stampMotif(mCtx,W,H,N,'#000'); mCtx.restore();
  const d=mCtx.getImageData(0,0,mW,mH).data;
  for(let i=0,t=mW*mH;i<t;i++){ const on=d[i*4]<128?1:0; mMask[i]=on; mInv[i]=on?0:1; }
  edt(mInv,mW,mH,mIn);            // 안쪽 거리만 필요하다
}
let matCache=null, matKey='';

const LX=-.42, LY=-.60, LZ=.68;
function normalise3(x,y,z){ const m=Math.hypot(x,y,z)||1; return [x/m,y/m,z/m]; }

function buildMaterial(kind,N){
  buildMatBuffers(N);
  const w=mW, h=mH, n=w*h;

  let mx=1e-6; for(let i=0;i<n;i++) if(mIn[i]>mx) mx=mIn[i];
  const bevel=clamp(mx*.80, 2.5, 11), inv=1/bevel;
  const hgt=new Float32Array(n);
  for(let i=0;i<n;i++){
    if(!mMask[i]) continue;
    const t=mIn[i]*inv, u=1-(t<1?t:1);
    hgt[i]=Math.sqrt(1-u*u);
  }

  // 유리 배경 — 도형을 다시 스탬프하지 않고 마스크를 흐려서 만든다
  let bgd=null;
  if(kind==='Glass'){
    const bimg=mCtx.createImageData(w,h);
    const bo=bimg.data;
    for(let i=0;i<n;i++){ const v=mMask[i]?96:240;
      bo[i*4]=v; bo[i*4+1]=v; bo[i*4+2]=v; bo[i*4+3]=255; }
    mCtx.putImageData(bimg,0,0);
    mCtx.save(); mCtx.filter='blur(3px)'; mCtx.drawImage(mCv,0,0); mCtx.restore();
    mCtx.filter='none';
    bgd=mCtx.getImageData(0,0,w,h).data;
  }

  let lx=LX,ly=LY,lz=LZ; { const m=1/Math.sqrt(lx*lx+ly*ly+lz*lz); lx*=m; ly*=m; lz*=m; }
  let hx=lx,hy=ly,hz=lz+1;{ const m=1/Math.sqrt(hx*hx+hy*hy+hz*hz); hx*=m; hy*=m; hz*=m; }

  const img=mCtx.createImageData(w,h), o=img.data;
  const S=5.4;

  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const i=y*w+x;
    if(!mMask[i]){
      const v = kind==='Glass' ? bgd[i*4] : 240;
      o[i*4]=v; o[i*4+1]=v; o[i*4+2]=v; o[i*4+3]=255; continue;
    }
    const xm=x>0?i-1:i, xp=x<w-1?i+1:i, ym=y>0?i-w:i, yp=y<h-1?i+w:i;
    const dx=(hgt[xp]-hgt[xm])*S, dy=(hgt[yp]-hgt[ym])*S;
    const im=1/Math.sqrt(dx*dx+dy*dy+1);
    const nx=-dx*im, ny=-dy*im, nz=im;
    let ndl=nx*lx+ny*ly+nz*lz; if(ndl<0) ndl=0;
    let ndh=nx*hx+ny*hy+nz*hz; if(ndh<0) ndh=0;
    const f1=1-nz, fres=f1*f1*Math.sqrt(f1);      // (1-nz)^2.5
    // 정수 지수는 반복 제곱으로 — Math.pow 대비 20배 이상 빠르다
    const h2=ndh*ndh, h4=h2*h2, h8=h4*h4, h16=h8*h8, h32=h16*h16;
    let v;

    if(kind==='Metal'){
      const band=.5+.5*Math.sin(ny*13+nx*7.5);
      const spec=h32*h8;                                   // ndh^40
      v=255*clamp(.02 + .14*ndl + .62*band*band*(.20+.80*ndl)
                  + spec*1.9 + fres*.30, 0, 1);
    } else if(kind==='Sand'){
      const g1=fbm(x*.85,y*.85,1), g2=fbm(x*2.0,y*2.0,1);
      const grain=(g1-.5)*.95 + (g2>.60?.42:0) - (g2<.38?.38:0);
      v=255*clamp(.20 + .46*ndl + grain, 0, 1);
    } else if(kind==='Cell'){
      const t=mIn[i]/(bevel*.72), tt=t<1?t:1;
      const b=.5+.5*Math.sin(tt*Math.PI*2.6-1.25);
      const b2=b*b;
      v=6 + b2*b*240;                                      // ≈ b^2.1
    } else if(kind==='Glass'){
      const kk=(1-hgt[i])*7;
      let sx2=(x+nx*kk)|0; if(sx2<0)sx2=0; else if(sx2>=w)sx2=w-1;
      let sy2=(y+ny*kk)|0; if(sy2<0)sy2=0; else if(sy2>=h)sy2=h-1;
      const b=bgd[(sy2*w+sx2)*4];
      v=clamp(b*.52 + 74 + fres*150 + h16*h4*h2*185, 0, 255);   // ndh^22
    } else {
      v=255*clamp(.10 + .80*ndl, 0, 1);
    }
    v=v<0?0:(v>255?255:v);
    o[i*4]=v; o[i*4+1]=v; o[i*4+2]=v; o[i*4+3]=255;
  }
  return { img, w, h };
}

// ═══════════════════════════════════════════════
//  처리
// ═══════════════════════════════════════════════
function drawBase(N){ stampMotif(ctx,W,H,N,'#0a0a0a'); }

function drawInvert(N){
  xoc.setTransform(DPR,0,0,DPR,0,0);
  xoc.clearRect(0,0,W,H);
  stampMotif(xoc,W,H,N,'#0a0a0a',{xor:true});
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(xo,0,0); ctx.restore();
}

function drawBleed(N,t){
  const img=pxc.createImageData(MW,MH), o=img.data;
  const reach=t*Math.min(MW,MH)*.20;          // 파문이 도달한 거리
  const gap=7.5;                              // 등고선 간격
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    const i=y*MW+x;
    let on=maskBits[i];                       // 원래 형태는 그대로 검게
    if(!on && reach>1){
      const d=sdOut[i] + (fbm(x*.045,y*.045,4)-.5)*3.4;
      if(d<reach){
        const ph=d%gap;
        const w=1.05 + 1.5*(1-d/reach);       // 가까울수록 두껍게
        if(ph<w) on=true;
      }
    }
    const v=on?10:240;
    o[i*4]=v; o[i*4+1]=v; o[i*4+2]=v; o[i*4+3]=255;
  }
  blit(img);
}

function drawTypo(N,t){
  const cell=Math.round(lerp(34,9,t));
  const tok=['C','T','L','Ca',''+seq[0],''+seq[1],''+seq[2],''+seq[3]];
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`700 ${Math.round(cell*.72)}px 'Courier New',monospace`;
  const sx=W/MW, sy=H/MH, cw=Math.max(2,Math.round(cell/sx));
  for(let cy0=0;cy0<MH;cy0+=cw) for(let cx0=0;cx0<MW;cx0+=cw){
    let hit=false;
    for(let oy=1;oy<cw&&!hit;oy+=Math.max(1,cw>>2))
      for(let ox=1;ox<cw;ox+=Math.max(1,cw>>2)){
        const j=(cy0+oy)*MW+(cx0+ox);
        if(j<MW*MH && maskBits[j]){ hit=true; break; } }
    if(!hit) continue;
    const X=cx0*sx, Y=cy0*sy;
    const h=((cx0*73856093)^(cy0*19349663))>>>0;
    const inv=(h%5)===0, solid=(h%11)===0;
    if(solid){ ctx.fillStyle='#0a0a0a'; ctx.fillRect(X,Y,cell,cell); continue; }
    if(cell<13){ ctx.fillStyle=inv?'#0a0a0a':'rgba(10,10,10,.55)';
      ctx.fillRect(X,Y,cell*.9,cell*.9); continue; }
    if(inv){ ctx.fillStyle='#0a0a0a'; ctx.fillRect(X,Y,cell,cell); ctx.fillStyle='#f0f0f0'; }
    else ctx.fillStyle='#0a0a0a';
    ctx.fillText(tok[h%tok.length], X+cell/2, Y+cell/2+1);
  }
}

function drawMatter(N,kind){
  if(kind==='Solid')   return drawBase(N);
  if(kind==='Outline'){ ctx.strokeStyle='#0a0a0a';
    return stampMotif(ctx,W,H,N,null,{strokeOnly:true,lw:2.3}); }
  if(matCache) blitCache(matCache); else drawBase(N);
  if(kind==='Sand') sandGrain(N);
}

// 알갱이는 화면 해상도에서 직접 찍어야 보인다
function sandGrain(N){
  if(!mMask) return;
  const sx=W/mW, sy=H/mH;
  const idx=[]; for(let i=0,t=mW*mH;i<t;i++) if(mMask[i]) idx.push(i);
  if(!idx.length) return;
  const n=Math.min(52000, idx.length*6);
  for(let k=0;k<n;k++){
    const i=idx[(Math.random()*idx.length)|0];
    const x=i%mW, y=(i/mW)|0;
    const v=Math.random();
    ctx.fillStyle = v<.42 ? 'rgba(10,10,10,.70)' : 'rgba(250,250,250,.62)';
    const r=1.1+Math.random()*1.5;
    ctx.fillRect(x*sx+Math.random()*3-1.5, y*sy+Math.random()*3-1.5, r, r);
  }
}

function renderForm(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#f0f0f0'; ctx.fillRect(0,0,W,H);
  const now=performance.now();
  const N = useBase ? 1 : faces;
  const hold=clamp((now-holdStart)/6500,0,1);
  const ML=MATERIALS.length;
  const mIdx = mode===G.MATTER
    ? ((Math.floor((now-matterT)/1000)%ML)+ML)%ML : 0;   // 음수 인덱스 방지
  const kind = MATERIALS[mIdx];

  if(mode===G.BLEED){ buildMask(N); buildSDF(); drawBleed(N,hold); }
  else if(mode===G.TYPO){ buildMask(N); drawTypo(N,hold); }
  else if(mode===G.MATTER){
    if(kind!=='Solid' && kind!=='Outline'){
      const key=kind+'|'+N+'|'+Math.round(W);
      if(matKey!==key || !matCache){ matCache=buildMaterial(kind,N); matKey=key; }
    }
    drawMatter(N,kind);
  }
  else if(mode===G.INVERT) drawInvert(N);
  else                     drawBase(N);
  txt('faces', useBase ? 1 : faces);
}

const ORDER=['fist','palm','bleed','typo','matter','invert'];

document.querySelectorAll('img[data-icon]').forEach(i=>{ i.src=ICON[i.dataset.icon]; });
const gEl=$('gestures');
for(const k of ORDER){
  const m=MODES[k], d=document.createElement('div');
  d.className='g'; d.dataset.mode=k;
  d.innerHTML=`<div class="ic"><img class="k" src="${ICON[m.icon+'_b']}" alt=""><img class="w" src="${ICON[m.icon+'_w']}" alt=""></div>
    <div><b>${m.en}</b><small>${m.how}</small></div>`;
  gEl.appendChild(d);
}
const SEQ_LAB=['C','T','L','Ca'];
function setSeqUI(){
  $('seqBig').textContent = `(${seq.join(', ')})`;
}
function setRoll(a){ $('roll').textContent=`(${a.join(', ')})`; }
const _txt={};
function txt(id,v){ v=String(v); if(_txt[id]!==v){ _txt[id]=v; $(id).textContent=v; } }

let toastTimer=0;
function toast(html, icon, ms){
  const t=$('toast'), im=t.querySelector('img');
  if(icon){ im.src=ICON[icon]; im.style.display=''; } else im.style.display='none';
  t.querySelector('span').innerHTML=html;
  t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), ms||1500);
}

let uiMode=null, lastModeChange=0, tried=new Set();
function enterForm(now){
  uiMode=null; tried=new Set(); lastModeChange=now;
  setSeqUI();
}
const SUGGEST_MS=9000, EXIT_MS=3000, EXIT_SHOW_MS=900;
function updateFormUI(now, seen){
  if(mode!==uiMode){
    const first = uiMode===null;
    uiMode=mode; lastModeChange=now; tried.add(mode);
    const m=MODES[mode]||MODES.fist;
    for(const it of gEl.children) it.classList.toggle('active', it.dataset.mode===mode);
    if(!first) toast(m.en, m.icon+'_w', 1500);
  }
  $('facesBox').classList.toggle('show', !useBase);

  let sug=null;
  if(seen && now-lastModeChange>SUGGEST_MS){
    const i=ORDER.indexOf(mode);
    sug = ORDER.find(k=>!tried.has(k)) || ORDER[(i+1)%ORDER.length];
  }
  for(const it of gEl.children) it.classList.toggle('suggest', it.dataset.mode===sug);

  const gone = now-lastSeen;
  const exiting = camOK && !seen && gone>EXIT_SHOW_MS;
  document.body.classList.toggle('exiting', exiting);
  if(camOK && !seen){
    const p=clamp(gone/EXIT_MS,0,1);
    $('exitArc').style.strokeDashoffset = p;
    txt('exitNum', Math.max(1, Math.ceil((EXIT_MS-gone)/1000)));
    if(p>=1){ register(); setState(ST.REG); }
  }
}

const ST={AOD:0,GATE:1,DRAW:2,FORM:3,REG:4};
let state=ST.AOD, tState=0;
let faces=3, facesF=3, useBase=true, mode=G.FIST;
let holdStart=0, matterT=0, gateT=0, camOK=false;
let hand=null, handed='Right', lastSeen=0;
const film=$('film');

function setState(s){
  state=s; tState=performance.now();
  document.body.className = ['aod','gate','draw','form','reg'][s];
  if(s===ST.FORM){ film.pause(); enterForm(tState); }
  else if(film.paused) film.play().catch(()=>{});
  if(s===ST.GATE) $('gRing').style.strokeDashoffset=1;
  if(s===ST.DRAW) $('draw').classList.remove('locked');
  if(s===ST.AOD)  $('aodCount').textContent='· '+String(codex.length).padStart(3,'0');
}

function applyGesture(g, now){
  const prev=mode;
  if(g===G.PALM){
    useBase=false;
    const deg=clamp(raw.tilt*180/Math.PI, -70, 70);       // 정면 0° = 3면
    const target = deg>0 ? clamp(3-(deg/60)*2, 1, 3) : clamp(3+(-deg/60)*3, 3, 6);
    facesF=lerp(facesF, target, .14);
    if(Math.abs(facesF-faces)>.52){ faces=clamp(Math.round(facesF),1,6); matCache=null; }
    mode=G.PALM;
  } else if(g===G.FIST){
    useBase=true; mode=G.FIST;
  } else if(g!==G.NONE){
    mode=g;                                               // 접촉 — 면 수는 그대로 유지
  }
  if(mode!==prev){ holdStart=now; if(mode===G.MATTER) matterT=now; matCache=null; }
}

// ═══════════════════════════════════════════════
//  도감 — 파라미터만 저장한다 (이미지 아님)
// ═══════════════════════════════════════════════
const KEY='spinex-v3';
let codex=[];
const GEN=['Cervex','Thorax','Lumbex','Caudex'];
function naming(s){
  const m=Math.max(...s), d=s.indexOf(m);
  const ep = s[2]>4?'obliqua' : s[3]>20?'radialis' : s[1]>13?'compacta'
           : s[0]>13?'magna'  : s[3]<6?'nodalis'   : 'recta';
  return `${GEN[d]} ${ep}`;
}
function loadCodex(){
  try{ codex=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ codex=[]; }
}
function save(){
  while(codex.length>200) codex.shift();
  try{ localStorage.setItem(KEY,JSON.stringify(codex)); }catch(e){}
}
function register(){
  const e={ n:naming(seq), s:[...seq], f: useBase?1:faces, t:Date.now() };
  codex.push(e); save();
  const g=$('regCv').getContext('2d');
  g.fillStyle='#f0f0f0'; g.fillRect(0,0,720,720);
  const keepS=seq, keepM=motif;
  g.save(); g.translate(360,360);
  const sc=Math.min(720/W,720/H)*1.04; g.scale(sc,sc); g.translate(-W/2,-H/2);
  stampMotif(g,W,H,e.f,'#0a0a0a'); g.restore();
  seq=keepS; motif=keepM;
  $('regName').textContent=e.n;
  $('regSeq').textContent=`(${e.s.join(', ')}) · Specimen ${String(codex.length).padStart(3,'0')}`;
}

// ═══════════════════════════════════════════════
//  PIP
// ═══════════════════════════════════════════════
const pipCv=$('pipCv'), pctx=pipCv.getContext('2d');
const BONES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function renderPIP(vid,g){
  const w=pipCv.width, h=pipCv.height;
  pctx.setTransform(1,0,0,1,0,0);
  pctx.fillStyle='#000'; pctx.fillRect(0,0,w,h);
  if(vid && vid.readyState>=2){
    pctx.save(); pctx.translate(w,0); pctx.scale(-1,1);
    pctx.drawImage(vid,0,0,w,h); pctx.restore();
    pctx.globalAlpha=1;
  }
  if(hand){
    const P=i=>[(1-hand[i].x)*w, hand[i].y*h];
    pctx.strokeStyle='rgba(255,255,255,.72)'; pctx.lineWidth=2;
    pctx.beginPath();
    for(const [a,b] of BONES){ const p=P(a),q=P(b); pctx.moveTo(p[0],p[1]); pctx.lineTo(q[0],q[1]); }
    pctx.stroke();
    for(let i=0;i<21;i++){ const p=P(i);
      pctx.fillStyle = (i===4||i===8||i===12||i===16||i===20) ? '#fff' : 'rgba(255,255,255,.55)';
      pctx.beginPath(); pctx.arc(p[0],p[1], i%4===0?4:3, 0, TAU); pctx.fill(); }
    if(raw.facing){
      pctx.strokeStyle='rgba(255,255,255,.9)'; pctx.lineWidth=2;
      pctx.strokeRect(3,3,w-6,h-6);
    }
  }
  if(dbg && hand){
    const r=handRatios(hand);
    pctx.fillStyle='rgba(0,0,0,.72)'; pctx.fillRect(0,h-60,w,60);
    pctx.fillStyle='#fff'; pctx.font="600 15px 'Courier New',monospace";
    pctx.textAlign='left';
    pctx.fillText('r '+r.map(v=>v.toFixed(3)).join(' '), 8, h-38);
    pctx.fillText('seq ('+seq.join(', ')+')', 8, h-14);
  }
  $('pipG').textContent = hand ? (GLABEL[g]||'—') : 'NO HAND';
  $('pipDot').classList.toggle('on', !!hand);
}

// ═══════════════════════════════════════════════
//  루프
// ═══════════════════════════════════════════════
let rollT=0, fps=60, fpsT=0, fpsN=0, dbg=false;
addEventListener('keydown',e=>{ if(e.key==='d'||e.key==='D'){ dbg=!dbg; document.documentElement.classList.toggle('dbg',dbg); } });
function loop(ts){
  requestAnimationFrame(loop);
  const now=performance.now();
  fpsN++; if(now-fpsT>1000){ fps=fpsN*1000/(now-fpsT); fpsN=0; fpsT=now;
    if(fps<44 && MS>.30){ MS=Math.max(.30,MS-.07); syncMask(); }
    else if(fps>56 && MS<.55){ MS=Math.min(.55,MS+.04); syncMask(); } }

  const seen = hand && (now-lastSeen)<600;
  const g = seen ? stabilise(analyse(hand,handed), now) : G.NONE;
  if(!seen){ hand=null; gStable=G.NONE; }
  renderPIP($('vid'), g);

  if(state===ST.AOD){
    $('aodGuide').classList.toggle('seen', !!seen && g!==G.PALM);
    if(seen && g===G.PALM){ gateT=now; setState(ST.GATE); }
  }
  else if(state===ST.GATE){
    const ok = seen && g===G.PALM;
    if(!ok){ setState(ST.AOD); return; }
    const p=clamp((now-gateT)/2000,0,1);
    $('gRing').style.strokeDashoffset = 1-p;
    if(p>=1){ setState(ST.DRAW); rollT=0; }
  }
  else if(state===ST.DRAW){
    if($('draw').classList.contains('locked')) return;
    if(!seen){ setState(ST.AOD); return; }
    if(now-rollT>55){ rollT=now; setRoll([rollOne(),rollOne(),rollOne(),rollOne()]); }
    if(g===G.FIST && now-tState>500){
      seq=seqFromHand(hand); buildMotif();
      setRoll(seq); $('draw').classList.add('locked');
      useBase=true; faces=3; facesF=3; mode=G.FIST; holdStart=now; matCache=null;
      $('hTitle').textContent=naming(seq);
      setTimeout(()=>setState(ST.FORM), 1100);
    }
  }
  else if(state===ST.FORM){
    if(seen) applyGesture(g, now);
    if(!useBase) spin += .0011;
    renderForm();
    updateFormUI(now, seen);
  }
  else if(state===ST.REG){
    if(now-tState>5200) setState(ST.AOD);
  }
}

// ═══════════════════════════════════════════════
//  카메라
// ═══════════════════════════════════════════════
async function initCam(){
  try{
    const vid=$('vid');
    vid.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:960,height:720}});
    await vid.play();
    const fs=await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const hl=await HandLandmarker.createFromOptions(fs,{
      baseOptions:{ modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate:"GPU" },
      runningMode:"VIDEO", numHands:1,
      minHandDetectionConfidence:.55, minHandPresenceConfidence:.55, minTrackingConfidence:.55 });
    camOK=true; $('warn').textContent='';
    (function pump(){
      requestAnimationFrame(pump);
      if(vid.readyState<2) return;
      const r=hl.detectForVideo(vid, performance.now());
      if(r.landmarks && r.landmarks.length){
        hand=r.landmarks[0];
        handed=(r.handednesses?.[0]?.[0]?.categoryName)||'Right';
        lastSeen=performance.now();
      } else { hand=null; }
    })();
  }catch(e){
    $('warn').textContent='No camera — keys: 1 generate · 2–7 modes · ←→ faces · 0 idle';
    addEventListener('keydown',e=>{
      const now=performance.now();
      if(e.key==='0'){ setState(ST.AOD); return; }
      if(e.key==='1'){
        seq=seqFromHand(null);
        buildMotif(); useBase=true; faces=3; facesF=3; mode=G.FIST;
        holdStart=now; matCache=null;
        $('hTitle').textContent=naming(seq); $('seqBig').textContent=`(${seq.join(', ')})`;
        setState(ST.FORM); return; }
      const map={'2':G.FIST,'3':G.PALM,'4':G.BLEED,'5':G.TYPO,'6':G.MATTER,'7':G.INVERT};
      if(map[e.key]){ mode=map[e.key]; holdStart=now; matterT=now; matCache=null;
        if(mode===G.FIST) useBase=true; if(mode===G.PALM) useBase=false; }
      if(e.key==='ArrowRight'&&!useBase){ faces=clamp(faces+1,1,6); facesF=faces; matCache=null; }
      if(e.key==='ArrowLeft' &&!useBase){ faces=clamp(faces-1,1,6); facesF=faces; matCache=null; }
    });
  }
}

film.addEventListener('error',()=>{
  $('warn').textContent=($('warn').textContent?$('warn').textContent+'\n':'')+
    'Background film spinex_film.mp4 not found — place it next to this HTML';
});
resize(); loadCodex(); buildMotif(); setState(ST.AOD);
requestAnimationFrame(loop);
initCam();
</script></body></html>
